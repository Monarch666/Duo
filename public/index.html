<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Duo — Private Sanctuary</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #FAF6EF;
      color: #332725;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #EBD7C2;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(51, 39, 37, 0.08);
    }
    .logo-img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 16px;
      box-shadow: 0 6px 16px rgba(132, 35, 44, 0.15);
      object-fit: cover;
    }
    h1 {
      font-family: Georgia, "Playfair Display", serif;
      font-size: 24px;
      font-weight: 700;
      color: #332725;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 13px;
      color: #735D57;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .input-group {
      text-align: left;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #594844;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #D9C3AE;
      border-radius: 12px;
      background: #FAF7F2;
      font-size: 14px;
      color: #332725;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: #84232C;
      background: #FFFFFF;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background: #84232C;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:hover { background: #6B1B22; }
    .btn:active { transform: scale(0.98); }
    .status-pill {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #8C7E72;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #E88D96;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192x192.png" alt="Duo Logo" class="logo-img" />
    <h1>Duo Sanctuary</h1>
    <p>Private sanctuary for two. Connecting to your shared space...</p>
    
    <div class="input-group">
      <label for="serverUrl">Sanctuary Server URL</label>
      <input type="text" id="serverUrl" placeholder="http://10.136.63.122:3000" />
    </div>

    <button class="btn" id="connectBtn" onclick="connectToServer()">Connect to Sanctuary</button>

    <div class="status-pill">
      <span class="dot"></span>
      <span id="statusText">Connecting automatically...</span>
    </div>
  </div>

  <script>
    const DEFAULT_URL = 'http://10.136.63.122:3000';
    const input = document.getElementById('serverUrl');
    const statusText = document.getElementById('statusText');
    const savedUrl = localStorage.getItem('duo_server_url') || DEFAULT_URL;

    input.value = savedUrl;

    function connectToServer() {
      let target = input.value.trim() || DEFAULT_URL;
      if (!target.startsWith('http://') && !target.startsWith('https://')) {
        target = 'http://' + target;
      }
      localStorage.setItem('duo_server_url', target);
      statusText.innerText = 'Connecting to ' + target + '...';
      window.location.href = target;
    }

    // Auto-attempt redirect on launch
    setTimeout(() => {
      fetch(savedUrl + '/api/realtime/poll', { method: 'HEAD', mode: 'no-cors' })
        .then(() => {
          window.location.href = savedUrl;
        })
        .catch(() => {
          statusText.innerText = 'Could not reach server. Verify PC is on the same Wi-Fi.';
        });
    }, 1200);
  </script>
</body>
</html>
